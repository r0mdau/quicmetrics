version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/r0mdau/quicmetrics
